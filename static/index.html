<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IdeaStack — AI Brainstorming Collective</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #ffffff;
      --surface:   #fafafa;
      --surface2:  #f2f2f2;
      --border:    #e8e8e8;
      --border2:   #c8c8c8;
      --text:      #111111;
      --text-dim:  #666666;
      --text-faint:#bbbbbb;
      --radius:    8px;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .logo-mark {
      font-size: 22px;
      color: var(--text);
      line-height: 1;
    }
    .logo-text {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }
    .logo-sep { color: var(--text-faint); margin: 0 4px; }
    .logo-sub {
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 400;
    }
    .header-idea {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-dim);
      font-style: italic;
      max-width: 400px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: none;
    }
    .header-idea.visible { display: block; }

    /* ── Input section ── */
    #input-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 28px 40px;
      flex-shrink: 0;
      transition: padding 0.3s ease;
    }
    #input-section.compact { padding: 20px 28px; }

    .input-label {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    .input-sublabel {
      font-size: 15px;
      color: var(--text-dim);
      text-align: center;
      margin-bottom: 28px;
    }
    #input-section.compact .input-label,
    #input-section.compact .input-sublabel { display: none; }

    .input-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 720px;
    }
    #idea-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 15px;
      padding: 13px 16px;
      outline: none;
      font-family: inherit;
      resize: none;
      height: 52px;
      min-height: 52px;
      transition: border-color 0.2s, box-shadow 0.2s;
      line-height: 1.5;
    }
    #idea-input::placeholder { color: var(--text-faint); }
    #idea-input:focus {
      border-color: var(--text);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }
    #idea-input:disabled { opacity: 0.4; cursor: not-allowed; }

    #run-btn {
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      height: 52px;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
    }
    #run-btn:hover:not(:disabled) { background: #333; }
    #run-btn:active:not(:disabled) { transform: scale(0.97); }
    #run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Agent preview strip (shown before first run) ── */
    #agent-strip {
      display: flex;
      gap: 8px;
      margin-top: 28px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 720px;
    }
    #input-section.compact #agent-strip { display: none; }
    .strip-card {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      font-size: 13px;
    }
    .strip-card .sc-emoji { font-size: 15px; }
    .strip-card .sc-name { font-weight: 600; color: var(--text); }
    .strip-card .sc-role { color: var(--text-dim); font-size: 12px; }

    /* ── Workspace ── */
    #workspace {
      display: none;
      flex: 1;
      min-height: 0;
    }
    #workspace.visible {
      display: grid;
      grid-template-columns: 220px 1fr;
    }

    /* ── Sidebar ── */
    #sidebar {
      border-right: 1px solid var(--border);
      background: var(--surface);
      overflow-y: auto;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-faint);
      padding: 4px 8px 10px;
    }

    .agent-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s;
      border: 1px solid transparent;
      position: relative;
    }
    .agent-card:hover { background: var(--surface2); }
    .agent-card.active {
      background: var(--surface2);
      border-color: var(--text);
    }
    .agent-card.viewing { background: var(--surface2); }

    .ac-emoji { font-size: 18px; flex-shrink: 0; }
    .ac-body { flex: 1; min-width: 0; }
    .ac-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ac-role {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ac-status {
      font-size: 13px;
      flex-shrink: 0;
      width: 18px;
      text-align: center;
      color: var(--text-faint);
    }
    .agent-card.done .ac-status { color: var(--text); }
    .agent-card.active .ac-status { color: var(--text); }

    /* pulsing dot for active agent */
    @keyframes pulse-ring {
      0%   { transform: scale(0.8); opacity: 0.8; }
      70%  { transform: scale(1.5); opacity: 0; }
      100% { transform: scale(0.8); opacity: 0; }
    }
    .pulse-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text);
      position: relative;
    }
    .pulse-dot::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--text);
      animation: pulse-ring 1.4s ease-out infinite;
    }

    .ac-duration {
      font-size: 10px;
      color: var(--text-faint);
      margin-top: 2px;
    }

    /* ── Content panel ── */
    #content {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    #agent-header {
      padding: 18px 32px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg);
    }
    .ah-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ah-emoji { font-size: 24px; }
    .ah-name {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }
    .ah-role {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 2px;
    }
    .ah-accent-bar {
      height: 2px;
      margin-top: 12px;
      width: 32px;
      background: var(--text);
    }

    #output-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      max-width: 820px;
    }

    /* Raw streaming area */
    #output-raw {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 13.5px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }
    #output-raw.hidden { display: none; }

    /* Rendered Markdown area */
    #output-md { display: none; }
    #output-md.visible { display: block; }

    /* Markdown styles */
    #output-md h1, #output-md h2, #output-md h3 {
      margin: 1.6em 0 0.5em;
      font-weight: 700;
      letter-spacing: -0.3px;
      line-height: 1.3;
      color: var(--text);
    }
    #output-md h1 { font-size: 21px; }
    #output-md h2 {
      font-size: 16px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    #output-md h3 { font-size: 15px; }
    #output-md p { margin: 0.75em 0; line-height: 1.8; font-size: 14.5px; color: var(--text); }
    #output-md ul, #output-md ol { padding-left: 20px; margin: 0.6em 0; }
    #output-md li { margin: 0.3em 0; line-height: 1.7; font-size: 14.5px; }
    #output-md strong { font-weight: 700; color: var(--text); }
    #output-md em { font-style: italic; color: var(--text-dim); }
    #output-md code {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 12.5px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: var(--text);
    }
    #output-md pre {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      margin: 1em 0;
    }
    #output-md pre code { background: none; border: none; padding: 0; font-size: 13px; }
    #output-md blockquote {
      border-left: 2px solid var(--border2);
      padding-left: 16px;
      color: var(--text-dim);
      margin: 0.8em 0;
    }
    #output-md table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
      font-size: 14px;
    }
    #output-md th {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      color: var(--text);
    }
    #output-md td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      color: var(--text);
    }
    #output-md tr:hover td { background: var(--surface); }
    #output-md hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.8em 0;
    }

    /* Scrollable table wrapper (added by renderMarkdown()) */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 1em 0;
    }
    .table-wrap table { margin: 0; }

    /* ── Re-run button (agent header) ── */
    .rerun-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--text-dim);
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
    }
    .rerun-btn:hover { border-color: var(--text); color: var(--text); }
    .rerun-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Discuss zone ── */
    #discuss-zone {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .discuss-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 16px;
    }
    #discuss-thread {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 16px;
    }
    .discuss-msg {
      max-width: 88%;
      border-radius: var(--radius);
      padding: 11px 15px;
      font-size: 14px;
      line-height: 1.7;
    }
    .discuss-msg.user {
      align-self: flex-end;
      background: var(--text);
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .discuss-msg.assistant {
      align-self: flex-start;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
      color: var(--text);
    }
    .discuss-msg.assistant p { margin: 0.5em 0; }
    .discuss-msg.assistant p:first-child { margin-top: 0; }
    .discuss-msg.assistant p:last-child { margin-bottom: 0; }
    .discuss-msg.assistant ul,
    .discuss-msg.assistant ol { padding-left: 18px; margin: 0.4em 0; }
    .discuss-msg.assistant li { margin: 0.2em 0; }
    .discuss-msg.assistant strong { font-weight: 700; }
    .discuss-msg.assistant code {
      background: var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .discuss-input-row {
      display: flex;
      gap: 8px;
    }
    #discuss-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      font-family: inherit;
      resize: none;
      height: 44px;
      min-height: 44px;
      transition: border-color 0.2s;
      line-height: 1.4;
    }
    #discuss-input:focus { border-color: var(--text); box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
    #discuss-input::placeholder { color: var(--text-faint); }
    #discuss-input:disabled { opacity: 0.4; cursor: not-allowed; }
    #discuss-send-btn {
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      height: 44px;
      font-family: inherit;
      transition: background 0.15s;
    }
    #discuss-send-btn:hover:not(:disabled) { background: #333; }
    #discuss-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Blinking cursor */
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity: 0; } }
    .cursor {
      display: inline-block;
      width: 2px; height: 1.1em;
      background: var(--text);
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
      margin-left: 1px;
    }

    /* Empty/placeholder state */
    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-faint);
      font-size: 14px;
      gap: 10px;
    }
    #placeholder .ph-icon { font-size: 36px; opacity: 0.3; }

    /* ── Status bar ── */
    #status-bar {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 10px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #progress-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .pdot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--border2);
      transition: background 0.3s, transform 0.3s;
    }
    .pdot.done { background: var(--text); }
    .pdot.active { transform: scale(1.4); background: var(--text-dim); }
    #status-text {
      font-size: 13px;
      color: var(--text-dim);
      flex: 1;
    }
    #export-btn, #export-plan-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      display: none;
      transition: background 0.15s;
    }
    #export-btn:hover, #export-plan-btn:hover { background: var(--surface2); }
    #export-btn.visible, #export-plan-btn.visible { display: flex; align-items: center; gap: 6px; }

    /* ── Context form ── */
    .ctx-toggle {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
    }
    .ctx-toggle:hover { color: var(--text); }
    #input-section.compact .ctx-toggle,
    #input-section.compact .ctx-form { display: none !important; }

    .ctx-form {
      display: none;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 720px;
      margin-top: 10px;
    }
    .ctx-form.open { display: flex; }
    .ctx-row { display: flex; gap: 8px; }
    .ctx-form input,
    .ctx-form select,
    .ctx-form textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .ctx-form input::placeholder,
    .ctx-form textarea::placeholder { color: var(--text-faint); }
    .ctx-form input:focus,
    .ctx-form select:focus,
    .ctx-form textarea:focus { border-color: var(--text); }
    .ctx-form select { cursor: pointer; appearance: auto; }
    .ctx-form textarea { resize: vertical; min-height: 56px; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #999; }

    /* ── Mobile ── */
    @media (max-width: 680px) {
      /* Header */
      header { padding: 12px 16px; gap: 8px; }
      .logo-sub { display: none; }
      .header-idea { display: none !important; }

      /* Input */
      #input-section { padding: 28px 16px 20px; }
      #input-section.compact { padding: 14px 16px; }
      .input-label { font-size: 22px; }
      .input-sublabel { font-size: 14px; margin-bottom: 20px; }
      .input-row { flex-direction: column; gap: 8px; }
      #idea-input { height: 80px; font-size: 16px; } /* 16px prevents iOS zoom */
      #run-btn { height: 46px; width: 100%; border-radius: var(--radius); }

      /* Agent strip pills — hide role text */
      #agent-strip { gap: 6px; }
      .strip-card .sc-role { display: none; }

      /* Context form — single column */
      .ctx-row { flex-direction: column; }
      .ctx-form input,
      .ctx-form select,
      .ctx-form textarea { font-size: 16px; } /* prevent iOS zoom */

      /* Workspace: sidebar → horizontal scroll tab bar */
      #workspace.visible {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      #sidebar {
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        height: auto;
        max-height: none;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 6px 10px;
        gap: 4px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none; /* hide scrollbar on mobile */
      }
      #sidebar::-webkit-scrollbar { display: none; }

      .sidebar-label { display: none; }

      .agent-card {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 68px;
        max-width: 68px;
        padding: 7px 4px;
        gap: 3px;
        flex-shrink: 0;
        text-align: center;
        border-radius: 6px;
      }
      .agent-card.active { border-width: 1.5px; }
      .ac-emoji { font-size: 18px; }
      .ac-name { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
      .ac-role, .ac-duration, .ac-status { display: none; }

      /* Content */
      #agent-header { padding: 12px 16px 10px; }
      .ah-emoji { font-size: 20px; }
      .ah-name { font-size: 16px; }
      .ah-role { font-size: 12px; }
      .ah-accent-bar { margin-top: 8px; }

      #output-wrap { padding: 16px; }
      #output-raw { font-size: 13px; line-height: 1.7; }
      #output-md p,
      #output-md li { font-size: 14px; line-height: 1.75; }
      #output-md h1 { font-size: 18px; }
      #output-md h2 { font-size: 15px; }
      #output-md h3 { font-size: 14px; }
      #output-md table { font-size: 12px; }
      #output-md th,
      #output-md td { padding: 6px 8px; }

      /* Status bar */
      #status-bar { padding: 8px 16px max(8px, env(safe-area-inset-bottom)) 16px; gap: 8px; }
      #status-text { font-size: 12px; }
      #export-btn { padding: 6px 10px; font-size: 12px; }

      /* Placeholder */
      #placeholder { font-size: 13px; padding: 0 16px; text-align: center; }
      #placeholder .ph-icon { font-size: 28px; }

      /* Discuss zone */
      #discuss-zone { margin-top: 24px; padding-top: 18px; }
      .discuss-msg { max-width: 95%; font-size: 13px; }
      #discuss-input { font-size: 16px; } /* prevent iOS zoom */
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <span class="logo-mark">◆</span>
  <span class="logo-text">IdeaStack</span>
  <span class="logo-sep">·</span>
  <span class="logo-sub">AI Brainstorming Collective</span>
  <span class="header-idea" id="header-idea"></span>
</header>

<!-- Input -->
<div id="input-section">
  <div class="input-label">What's your idea?</div>
  <div class="input-sublabel">Six AI personas will stress-test, reimagine, and synthesize your concept into a Blue Ocean brief.</div>
  <div class="input-row">
    <textarea
      id="idea-input"
      placeholder="Describe your seed idea — the more specific, the sharper the analysis…"
      rows="1"
      onkeydown="handleKey(event)"
    ></textarea>
    <button id="run-btn" onclick="startBrainstorm()">Brainstorm ▶</button>
  </div>
  <div id="agent-strip"></div>
  <div class="ctx-toggle" onclick="toggleContext()">
    <span id="ctx-label">+ Add context</span> <span id="ctx-arrow">▾</span>
  </div>
  <div id="context-form" class="ctx-form">
    <div class="ctx-row">
      <input id="ctx-country"  type="text" placeholder="Country / Region  (e.g. India, UK, SE Asia)">
      <input id="ctx-industry" type="text" placeholder="Industry / Sector  (e.g. FinTech, AgriTech)">
    </div>
    <div class="ctx-row">
      <select id="ctx-stage">
        <option value="">Stage — optional</option>
        <option value="Early idea">Early idea</option>
        <option value="Validated concept">Validated concept</option>
        <option value="Pre-revenue MVP">Pre-revenue MVP</option>
        <option value="Early traction">Early traction</option>
        <option value="Scaling">Scaling</option>
      </select>
      <input id="ctx-audience" type="text" placeholder="Target Audience  (e.g. gig workers, SMEs)">
    </div>
    <textarea id="ctx-notes" placeholder="Notes — budget, team size, constraints, goals…" rows="2"></textarea>
  </div>
</div>

<!-- Workspace -->
<div id="workspace">
  <div id="sidebar">
    <div class="sidebar-label">Panel</div>
  </div>
  <div id="content">
    <div id="agent-header" style="display:none"></div>
    <div id="output-wrap">
      <div id="placeholder">
        <span class="ph-icon">🧠</span>
        <span>Select an agent from the panel to read their analysis</span>
      </div>
      <div id="output-raw" class="hidden"></div>
      <div id="output-md"></div>
      <div id="discuss-zone" style="display:none">
        <div class="discuss-label">Follow-up</div>
        <div id="discuss-thread"></div>
        <div class="discuss-input-row">
          <textarea id="discuss-input" placeholder="Ask a follow-up…" onkeydown="handleDiscussKey(event)"></textarea>
          <button id="discuss-send-btn" onclick="sendDiscussion()">Ask ↵</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Status bar -->
<div id="status-bar" style="display:none">
  <div id="progress-dots"></div>
  <span id="status-text">Starting…</span>
  <button id="export-btn" onclick="exportMarkdown()">↓ Export Markdown</button>
  <button id="export-plan-btn" onclick="exportClaudeCodePlan()">↓ Export Claude Code Plan</button>
</div>

<script>
  // Render markdown and wrap tables for horizontal scrollability on mobile
  function renderMarkdown(el, content) {
    el.innerHTML = marked.parse(content || "");
    el.querySelectorAll('table').forEach(t => {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });
  }

  // Mirror of Python AGENTS list (name/emoji/color/role only — prompts live server-side)
  const AGENTS = [
    { name: "The Maverick",       emoji: "🚀", color: "#111", role: "Unconstrained Imagination"       },
    { name: "The Contrarian",     emoji: "⚔️",  color: "#111", role: "Adversarial Stress-Tester"      },
    { name: "The Alchemist",      emoji: "⚗️",  color: "#111", role: "First-Principles Reconstructor" },
    { name: "The Oracle",         emoji: "🔮", color: "#111", role: "Convergent-Trends Analyst"       },
    { name: "The Street Fighter", emoji: "🥊", color: "#111", role: "Ruthless Pragmatist"             },
    { name: "The Navigator",      emoji: "🧭", color: "#111", role: "Blue Ocean Synthesizer"          },
  ];

  // Session state
  let state = {
    seedIdea: "",
    agentBuffers: {},       // index → raw text accumulated
    agentDone: {},          // index → true when complete
    agentDuration: {},      // index → seconds
    currentAgent: -1,       // index currently streaming
    viewingAgent: -1,       // index shown in content panel
    running: false,
    complete: false,
    lastContext: null,       // context object saved at brainstorm start
    agentDiscussions: {},    // index → [{role, text, streaming?}]
    discussStreaming: false, // true while a discuss SSE is in flight
  };

  // ── Init agent strip on landing page ──
  function initStrip() {
    const strip = document.getElementById("agent-strip");
    AGENTS.forEach(a => {
      const el = document.createElement("div");
      el.className = "strip-card";
      el.innerHTML = `<span class="sc-emoji">${a.emoji}</span><span class="sc-name" style="color:${a.color}">${a.name}</span><span class="sc-role"> · ${a.role}</span>`;
      strip.appendChild(el);
    });
  }

  // ── Build sidebar agent cards ──
  function initSidebar() {
    const sidebar = document.getElementById("sidebar");
    sidebar.innerHTML = '<div class="sidebar-label">Panel</div>';
    AGENTS.forEach((a, i) => {
      const card = document.createElement("div");
      card.className = "agent-card";
      card.id = `card-${i}`;
      card.style.setProperty("--agent-color", a.color);
      card.innerHTML = `
        <div class="ac-emoji">${a.emoji}</div>
        <div class="ac-body">
          <div class="ac-name">${a.name}</div>
          <div class="ac-role">${a.role}</div>
          <div class="ac-duration" id="dur-${i}"></div>
        </div>
        <div class="ac-status" id="status-${i}">○</div>
      `;
      card.addEventListener("click", () => viewAgent(i));
      sidebar.appendChild(card);
    });
  }

  // ── Build progress dots ──
  function initDots() {
    const wrap = document.getElementById("progress-dots");
    wrap.innerHTML = "";
    AGENTS.forEach((_, i) => {
      const d = document.createElement("div");
      d.className = "pdot";
      d.id = `dot-${i}`;
      wrap.appendChild(d);
    });
  }

  // ── Show agent in content panel ──
  function viewAgent(index) {
    if (state.agentBuffers[index] === undefined && !state.running) return;

    state.viewingAgent = index;
    const agent = AGENTS[index];
    const done  = state.agentDone[index];

    // Update sidebar "viewing" highlight
    document.querySelectorAll(".agent-card").forEach((c, i) => {
      c.classList.toggle("viewing", i === index && i !== state.currentAgent);
    });

    // Agent header — include re-run button once the agent is done
    const hdr = document.getElementById("agent-header");
    hdr.style.display = "block";
    hdr.innerHTML = `
      <div class="ah-top">
        <span class="ah-emoji">${agent.emoji}</span>
        <div>
          <div class="ah-name" style="color:${agent.color}">${agent.name}</div>
          <div class="ah-role">${agent.role}</div>
        </div>
        ${done ? `<button class="rerun-btn" onclick="rerunAgent(${index})" ${state.running ? 'disabled' : ''}>↺ Re-run</button>` : ''}
      </div>
      <div class="ah-accent-bar" style="background:${agent.color}"></div>
    `;

    // Hide placeholder
    document.getElementById("placeholder").style.display = "none";

    const rawEl  = document.getElementById("output-raw");
    const mdEl   = document.getElementById("output-md");
    const discEl = document.getElementById("discuss-zone");

    if (done) {
      // Render Markdown
      rawEl.classList.add("hidden");
      mdEl.classList.add("visible");
      renderMarkdown(mdEl, state.agentBuffers[index]);
      mdEl.style.display = "block";
      // Show discuss zone for this agent
      discEl.style.display = "block";
      renderDiscussZone(index);
    } else {
      // Show raw streaming view
      rawEl.classList.remove("hidden");
      mdEl.classList.remove("visible");
      mdEl.style.display = "none";
      rawEl.innerHTML = escapeHtml(state.agentBuffers[index] || "");
      if (index === state.currentAgent) {
        rawEl.innerHTML += '<span class="cursor"></span>';
      }
      discEl.style.display = "none";
      scrollToBottom();
    }
  }

  function scrollToBottom() {
    const wrap = document.getElementById("output-wrap");
    wrap.scrollTop = wrap.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // ── SSE event handlers ──
  function onAgentStart(data) {
    const { index, name, color, role } = data;
    state.currentAgent = index;
    state.agentBuffers[index] = "";
    state.viewingAgent = index;

    // Sidebar card → active
    document.querySelectorAll(".agent-card").forEach((c, i) => {
      c.classList.remove("active", "viewing");
      if (i === index) c.classList.add("active");
    });

    // Status icon → pulsing dot
    const statusEl = document.getElementById(`status-${index}`);
    statusEl.innerHTML = `<span class="pulse-dot" style="--agent-color:${color}"></span>`;

    // Progress dot → active
    const dot = document.getElementById(`dot-${index}`);
    if (dot) dot.classList.add("active");

    // Status bar text
    document.getElementById("status-text").textContent =
      `${data.emoji} ${name} — ${role}  ·  Agent ${index + 1} of ${data.total}`;

    // Show content panel for this agent
    viewAgent(index);
  }

  function onToken(data) {
    const { index, text } = data;
    state.agentBuffers[index] = (state.agentBuffers[index] || "") + text;

    // Only update DOM if we're viewing this agent
    if (state.viewingAgent === index) {
      const rawEl = document.getElementById("output-raw");
      const agent = AGENTS[index];
      rawEl.innerHTML = escapeHtml(state.agentBuffers[index])
        + `<span class="cursor"></span>`;
      scrollToBottom();
    }
  }

  function onAgentEnd(data) {
    const { index, duration_s } = data;
    state.agentDone[index] = true;
    state.agentDuration[index] = duration_s;

    // Sidebar: mark done
    const card = document.getElementById(`card-${index}`);
    card.classList.remove("active");
    card.classList.add("done");

    const statusEl = document.getElementById(`status-${index}`);
    statusEl.innerHTML = "✓";

    const durEl = document.getElementById(`dur-${index}`);
    durEl.textContent = `${duration_s}s`;

    // Progress dot → done
    const dot = document.getElementById(`dot-${index}`);
    if (dot) { dot.classList.remove("active"); dot.classList.add("done"); }

    // If we're viewing this agent, upgrade to rendered view (markdown + discuss zone + re-run btn)
    if (state.viewingAgent === index) viewAgent(index);
  }

  function onComplete(data) {
    state.running = false;
    state.complete = true;
    state.currentAgent = -1;

    document.getElementById("status-text").textContent =
      `✓ All ${data.total} agents complete`;
    document.getElementById("export-btn").classList.add("visible");
    document.getElementById("export-plan-btn").classList.add("visible");

    // Re-enable input
    document.getElementById("idea-input").disabled = false;
    document.getElementById("run-btn").disabled = false;
    document.getElementById("run-btn").textContent = "New Brainstorm ▶";
  }

  function onError(data) {
    const msg = `Error in agent ${data.index + 1}: ${data.message}`;
    document.getElementById("status-text").textContent = "⚠ " + msg;
    state.running = false;
    document.getElementById("idea-input").disabled = false;
    document.getElementById("run-btn").disabled = false;
    document.getElementById("run-btn").textContent = "Retry ▶";
  }

  // ── Parse SSE stream from fetch response ──
  async function readSSE(response) {
    const reader  = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop() ?? "";  // keep incomplete tail

      for (const chunk of parts) {
        let event = "";
        let data  = "";
        for (const line of chunk.split("\n")) {
          if (line.startsWith("event: ")) event = line.slice(7).trim();
          else if (line.startsWith("data: ")) data = line.slice(6).trim();
        }
        if (!event || !data) continue;
        try {
          const parsed = JSON.parse(data);
          if      (event === "agent_start") onAgentStart(parsed);
          else if (event === "token")       onToken(parsed);
          else if (event === "agent_end")   onAgentEnd(parsed);
          else if (event === "complete")    onComplete(parsed);
          else if (event === "error")       onError(parsed);
        } catch { /* malformed JSON, skip */ }
      }
    }
  }

  // ── Main entry point ──
  async function startBrainstorm() {
    const idea = document.getElementById("idea-input").value.trim();
    if (!idea || state.running) return;

    // Reset state
    const savedCtx = getContext();
    state = {
      seedIdea: idea,
      agentBuffers: {},
      agentDone: {},
      agentDuration: {},
      currentAgent: -1,
      viewingAgent: -1,
      running: true,
      complete: false,
      lastContext: savedCtx,
      agentDiscussions: {},
      discussStreaming: false,
    };

    // UI transitions
    document.getElementById("idea-input").disabled = true;
    document.getElementById("run-btn").disabled = true;
    document.getElementById("run-btn").textContent = "Running…";
    document.getElementById("input-section").classList.add("compact");
    document.getElementById("workspace").classList.add("visible");
    document.getElementById("status-bar").style.display = "flex";
    document.getElementById("export-btn").classList.remove("visible");
    document.getElementById("export-plan-btn").classList.remove("visible");
    document.getElementById("placeholder").style.display = "flex";
    document.getElementById("agent-header").style.display = "none";
    document.getElementById("output-raw").classList.add("hidden");
    document.getElementById("output-md").classList.remove("visible");
    document.getElementById("output-md").style.display = "none";
    document.getElementById("discuss-zone").style.display = "none";

    // Show idea in header, with optional region tag
    const headerIdea = document.getElementById("header-idea");
    const ctx = getContext();
    const region = ctx.country || ctx.industry;
    headerIdea.textContent = region ? `"${idea}"  ·  ${region}` : `"${idea}"`;
    headerIdea.classList.add("visible");

    initSidebar();
    initDots();

    try {
      const response = await fetch("/brainstorm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ seed_idea: idea, context: getContext() }),
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({ detail: "Unknown error" }));
        onError({ index: 0, message: err.detail || response.statusText });
        return;
      }

      await readSSE(response);
    } catch (err) {
      onError({ index: 0, message: err.message });
    }
  }

  // ── Discuss zone ──

  function renderDiscussZone(agentIndex) {
    const agent  = AGENTS[agentIndex];
    const thread = document.getElementById("discuss-thread");
    const input  = document.getElementById("discuss-input");
    const sendBtn = document.getElementById("discuss-send-btn");

    input.placeholder = `Ask ${agent.name} a follow-up…`;
    input.disabled    = state.discussStreaming;
    sendBtn.disabled  = state.discussStreaming;
    document.getElementById("discuss-zone").dataset.agentIndex = agentIndex;

    const msgs = state.agentDiscussions[agentIndex] || [];
    thread.innerHTML = "";
    msgs.forEach((msg, i) => {
      const el = document.createElement("div");
      el.className = `discuss-msg ${msg.role}`;
      if (msg.role === "assistant") {
        if (msg.streaming) {
          el.textContent = msg.text;
        } else {
          renderMarkdown(el, msg.text);
        }
      } else {
        el.textContent = msg.text;
      }
      thread.appendChild(el);
    });
  }

  function buildDiscussThread(agentIndex) {
    const msgs = state.agentDiscussions[agentIndex] || [];
    // Exclude the last two: the current question + the streaming placeholder
    return msgs.slice(0, -2).map(m => ({ role: m.role, text: m.text }));
  }

  async function sendDiscussion() {
    const zone       = document.getElementById("discuss-zone");
    const agentIndex = parseInt(zone.dataset.agentIndex);
    const input      = document.getElementById("discuss-input");
    const question   = input.value.trim();
    if (!question || state.discussStreaming) return;

    input.value = "";

    if (!state.agentDiscussions[agentIndex]) state.agentDiscussions[agentIndex] = [];
    state.agentDiscussions[agentIndex].push({ role: "user",      text: question });
    state.agentDiscussions[agentIndex].push({ role: "assistant", text: "", streaming: true });
    state.discussStreaming = true;
    renderDiscussZone(agentIndex);
    scrollToBottom();

    try {
      const resp = await fetch("/discuss", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          agent_index:     agentIndex,
          seed_idea:       state.seedIdea,
          context:         state.lastContext,
          agent_analysis:  state.agentBuffers[agentIndex] || "",
          thread:          buildDiscussThread(agentIndex),
          question:        question,
        }),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({ detail: "Unknown error" }));
        throw new Error(err.detail || resp.statusText);
      }
      await readDiscussSSE(resp, agentIndex);
    } catch (err) {
      const msgs = state.agentDiscussions[agentIndex];
      msgs[msgs.length - 1] = { role: "assistant", text: `⚠ ${err.message}` };
      state.discussStreaming = false;
      renderDiscussZone(agentIndex);
    }
  }

  async function readDiscussSSE(response, agentIndex) {
    const reader  = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop() ?? "";

      for (const chunk of parts) {
        let event = "", data = "";
        for (const line of chunk.split("\n")) {
          if (line.startsWith("event: ")) event = line.slice(7).trim();
          else if (line.startsWith("data: ")) data = line.slice(6).trim();
        }
        if (!event || !data) continue;
        try {
          const parsed = JSON.parse(data);
          const msgs   = state.agentDiscussions[agentIndex];
          const last   = msgs && msgs[msgs.length - 1];

          if (event === "token" && last?.streaming) {
            last.text += parsed.text;
            // Efficiently update last bubble while streaming
            const thread = document.getElementById("discuss-thread");
            const lastEl = thread.lastElementChild;
            if (lastEl) lastEl.textContent = last.text;
            scrollToBottom();
          } else if (event === "complete") {
            if (last?.streaming) last.streaming = false;
            state.discussStreaming = false;
            renderDiscussZone(agentIndex);
          } else if (event === "error") {
            if (last) { last.text = `⚠ ${parsed.message}`; last.streaming = false; }
            state.discussStreaming = false;
            renderDiscussZone(agentIndex);
          }
        } catch { /* skip malformed */ }
      }
    }
  }

  function handleDiscussKey(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendDiscussion(); }
  }

  // ── Re-run a single agent ──
  async function rerunAgent(index) {
    if (state.running) return;
    state.running = true;
    state.currentAgent = index;
    state.agentBuffers[index] = "";
    state.agentDone[index] = false;
    state.agentDuration[index] = undefined;
    state.agentDiscussions[index] = [];

    // Sidebar card → active
    const card = document.getElementById(`card-${index}`);
    card.classList.remove("done", "viewing");
    card.classList.add("active");
    document.getElementById(`status-${index}`).innerHTML = `<span class="pulse-dot"></span>`;
    document.getElementById(`dur-${index}`).textContent = "";
    const dot = document.getElementById(`dot-${index}`);
    if (dot) { dot.classList.remove("done"); dot.classList.add("active"); }

    document.getElementById("export-plan-btn").classList.remove("visible");
    document.getElementById("status-text").textContent =
      `${AGENTS[index].emoji} ${AGENTS[index].name} — re-running…`;

    // Switch content panel to streaming view for this agent
    state.viewingAgent = index;
    viewAgent(index);

    // Prior completed outputs (skip the agent being re-run)
    const priorOutputs = AGENTS.map((a, i) => {
      if (i === index || !state.agentDone[i]) return null;
      return { name: a.name, emoji: a.emoji, role: a.role, color: a.color, output: state.agentBuffers[i] };
    }).filter(Boolean);

    try {
      const resp = await fetch("/run-agent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          agent_index:   index,
          seed_idea:     state.seedIdea,
          context:       state.lastContext,
          prior_outputs: priorOutputs,
        }),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({ detail: "Unknown error" }));
        onError({ index, message: err.detail || resp.statusText });
        return;
      }
      await readSSE(resp);
    } catch (err) {
      onError({ index, message: err.message });
    }
  }

  // ── Export Claude Code Plan ──
  function exportClaudeCodePlan() {
    const ts  = new Date().toISOString().slice(0, 16).replace("T", " ");
    const ctx = state.lastContext || {};

    const lines = [
      `# IdeaStack — Claude Code Execution Plan`,
      ``,
      `> Generated: ${ts}`,
      ``,
      `---`,
      ``,
      `## Seed Idea`,
      ``,
      `> ${state.seedIdea}`,
      ``,
    ];

    const ctxRows = [
      ctx.country         && `- **Country / Region:** ${ctx.country}`,
      ctx.industry        && `- **Industry / Sector:** ${ctx.industry}`,
      ctx.stage           && `- **Stage:** ${ctx.stage}`,
      ctx.target_audience && `- **Target Audience:** ${ctx.target_audience}`,
      ctx.notes           && `- **Notes:** ${ctx.notes}`,
    ].filter(Boolean);
    if (ctxRows.length) {
      lines.push(`## Context`, ``, ...ctxRows, ``);
    }

    lines.push(`---`, ``, `## Panel Analysis`, ``);

    AGENTS.forEach((a, i) => {
      const content = state.agentBuffers[i];
      if (!content) return;
      const dur = state.agentDuration[i] ? ` *(${state.agentDuration[i]}s)*` : "";
      lines.push(`### ${a.emoji} ${a.name} — ${a.role}${dur}`, ``, content, ``, `---`, ``);

      const disc = state.agentDiscussions[i];
      if (disc && disc.length) {
        lines.push(`#### Follow-up with ${a.name}`, ``);
        disc.forEach(m => {
          if (m.role === "user")      lines.push(`**You:** ${m.text}`, ``);
          else if (!m.streaming)     lines.push(`**${a.name}:**`, ``, m.text, ``);
        });
        lines.push(`---`, ``);
      }
    });

    // Task scaffold for Claude Code
    const navOutput  = state.agentBuffers[5] || "";
    const firstMove  = navOutput.match(/##\s*FIRST MOVE\s*\n([\s\S]+?)(?=\n##|$)/)?.[1]?.trim() || "";
    const beachhead  = navOutput.match(/##\s*THE BEACHHEAD\s*\n([\s\S]+?)(?=\n##|$)/)?.[1]?.trim() || "";
    const practPath  = navOutput.match(/##\s*THE PRACTICAL PATH\s*\n([\s\S]+?)(?=\n##|$)/)?.[1]?.trim() || "";

    lines.push(
      `## Task for Claude Code`,
      ``,
      `This is a complete IdeaStack brainstorming session. Use the Navigator's Blue Ocean Brief above as the product vision and the Street Fighter's analysis as the execution constraint.`,
      ``,
      `**Seed idea:** ${state.seedIdea}`,
      ``,
    );
    if (firstMove)  lines.push(`**First Move (Navigator):**`, ``, firstMove, ``);
    if (beachhead)  lines.push(`**Beachhead (Navigator):**`,  ``, beachhead, ``);
    if (practPath)  lines.push(`**Practical Path:**`,         ``, practPath, ``);
    lines.push(
      `**Instructions for Claude Code:**`,
      `1. Read the Navigator's Blue Ocean Brief — it is the synthesis of all six analyses.`,
      `2. Use the Street Fighter's MVP as the scope boundary for what to build first.`,
      `3. Reference the Contrarian's failure modes as edge cases to test against.`,
      `4. Implement the First Move as the immediate deliverable.`,
      `5. Follow the Practical Path for phasing (Month 1-3 → 4-9 → 10-18).`,
      ``,
      `---`,
      ``,
      `*Generated by IdeaStack — AI Brainstorming Collective*`,
    );

    const blob = new Blob([lines.join("\n")], { type: "text/markdown" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = `ideastack-claude-code-plan-${Date.now()}.md`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── Export to Markdown ──
  function exportMarkdown() {
    const ts = new Date().toISOString().slice(0, 16).replace("T", " ");
    const lines = [
      `# IdeaStack Session — ${ts}`,
      "",
      `## Seed Idea`,
      "",
      state.seedIdea,
      "",
      "---",
      "",
    ];
    AGENTS.forEach((a, i) => {
      const content = state.agentBuffers[i];
      if (!content) return;
      const dur = state.agentDuration[i] ? ` · ${state.agentDuration[i]}s` : "";
      lines.push(`## ${a.emoji} ${a.name} — ${a.role}${dur}`);
      lines.push("");
      lines.push(content);
      lines.push("");
      lines.push("---");
      lines.push("");
    });

    const blob = new Blob([lines.join("\n")], { type: "text/markdown" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = `ideastack-${Date.now()}.md`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── Enter key in textarea ──
  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      startBrainstorm();
    }
  }

  // ── Context form toggle ──
  function toggleContext() {
    const form  = document.getElementById("context-form");
    const arrow = document.getElementById("ctx-arrow");
    const label = document.getElementById("ctx-label");
    const open  = form.classList.toggle("open");
    arrow.textContent = open ? "▴" : "▾";
    label.textContent = open ? "− Hide context" : "+ Add context";
  }

  function getContext() {
    return {
      country:         document.getElementById("ctx-country").value.trim(),
      industry:        document.getElementById("ctx-industry").value.trim(),
      stage:           document.getElementById("ctx-stage").value.trim(),
      target_audience: document.getElementById("ctx-audience").value.trim(),
      notes:           document.getElementById("ctx-notes").value.trim(),
    };
  }

  // ── Init on load ──
  initStrip();
</script>
</body>
</html>
